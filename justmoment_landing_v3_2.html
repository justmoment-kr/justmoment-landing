<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잠깐서봐 — 매일 아침 책 한 권의 핵심</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF8F4;
    --ink: #1C1C1A;
    --ink-light: #5A5A56;
    --ink-muted: #9A9A94;
    --amber: #C4710A;
    --amber-bg: #FEF3E2;
    --border: #E4E2DC;
    --white: #FFFFFF;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(250, 248, 244, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 0 max(24px, calc((100% - 1100px) / 2));
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    font-family: 'Noto Serif KR', serif;
    font-size: 17px; font-weight: 600;
    color: var(--ink); text-decoration: none;
    letter-spacing: -0.3px;
  }
  .nav-cta {
    background: var(--ink);
    color: var(--white);
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 13px; font-weight: 500;
    text-decoration: none;
    transition: opacity .2s;
  }
  .nav-cta:hover { opacity: .8; }

  /* SECTIONS */
  section { padding: 100px max(24px, calc((100% - 1100px) / 2)); }

  /* HERO */
  .hero {
    padding-top: 160px;
    padding-bottom: 100px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .hero-eyebrow {
    font-size: 12px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -1px;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--amber);
  }
  .hero-desc {
    font-size: 17px;
    color: var(--ink-light);
    line-height: 1.8;
    margin-bottom: 36px;
    font-weight: 300;
  }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--ink);
    color: var(--white);
    padding: 14px 28px;
    border-radius: 100px;
    font-size: 15px; font-weight: 500;
    text-decoration: none;
    transition: opacity .2s;
    display: inline-block;
  }
  .btn-primary:hover { opacity: .8; }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    padding: 14px 28px;
    border-radius: 100px;
    border: 1px solid var(--border);
    font-size: 15px; font-weight: 400;
    text-decoration: none;
    transition: border-color .2s;
    display: inline-block;
  }
  .btn-secondary:hover { border-color: var(--ink-light); }

  /* HERO VISUAL */
  .hero-visual {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    position: relative;
  }
  .msg-card .day-badge {
    font-size: 11px; font-weight: 500;
    color: var(--amber);
    background: var(--amber-bg);
    padding: 3px 10px; border-radius: 100px;
    display: inline-block; margin-bottom: 10px;
  }
  .msg-card .msg-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .msg-card .msg-body {
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.7;
  }
  .msg-card .msg-footer {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--ink-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .kakao-dot {
    width: 8px; height: 8px;
    background: #FEE500;
    border-radius: 50%;
    display: inline-block;
  }
  .msg-card.dim { opacity: .55; transform: scale(0.98); }

  /* STATS */
  .stats-bar {
    background: var(--white);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 40px max(24px, calc((100% - 1100px) / 2));
    display: flex; gap: 0;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 0 20px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 36px; font-weight: 600;
    color: var(--ink);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-label { font-size: 13px; color: var(--ink-muted); }

  /* HOW */
  .how-header { text-align: center; margin-bottom: 60px; }
  .section-eyebrow {
    font-size: 12px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 14px;
  }
  .section-title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(26px, 3vw, 38px);
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.3;
    color: var(--ink);
  }
  .steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .step {
    background: var(--white);
    padding: 40px 32px;
    border: 1px solid var(--border);
  }
  .step:first-child { border-radius: 16px 0 0 16px; }
  .step:last-child { border-radius: 0 16px 16px 0; }
  .step-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 40px; font-weight: 600;
    color: var(--border);
    line-height: 1;
    margin-bottom: 20px;
  }
  .step h3 {
    font-size: 18px; font-weight: 500;
    color: var(--ink);
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .step p { font-size: 14px; color: var(--ink-light); line-height: 1.7; }

  /* CONTENT */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }
  .content-text h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 20px;
    color: var(--ink);
  }
  .content-text p {
    font-size: 15px;
    color: var(--ink-light);
    line-height: 1.8;
    margin-bottom: 28px;
    font-weight: 300;
  }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    font-size: 12px; font-weight: 500;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--ink-light);
  }
  .book-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .book-item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .book-icon {
    width: 36px; height: 44px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .book-item-title { font-size: 14px; font-weight: 500; color: var(--ink); }
  .book-item-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

  /* PRICING */
  .pricing-header { text-align: center; margin-bottom: 50px; }

  /* 얼리버드 히어로 카드 */
  .earlybird-wrap {
    max-width: 520px;
    margin: 0 auto 40px;
  }
  .earlybird-card {
    background: var(--ink);
    border-radius: 24px;
    padding: 44px 40px;
    color: var(--white);
    position: relative;
    overflow: hidden;
  }
  .earlybird-card::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: rgba(196,113,10,0.18);
    border-radius: 50%;
  }
  .eb-tag {
    display: inline-block;
    background: var(--amber);
    color: var(--white);
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 4px 14px; border-radius: 100px;
    margin-bottom: 20px;
  }
  .eb-price-row {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 6px;
  }
  .eb-price {
    font-family: 'Noto Serif KR', serif;
    font-size: 52px; font-weight: 600;
    line-height: 1;
    color: var(--white);
  }
  .eb-price-unit { font-size: 18px; color: rgba(255,255,255,0.6); }
  .eb-strikethrough {
    font-size: 16px;
    color: rgba(255,255,255,0.35);
    text-decoration: line-through;
  }
  .eb-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 28px;
  }
  .eb-features { list-style: none; margin-bottom: 32px; }
  .eb-features li {
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 10px;
  }
  .eb-features li:last-child { border-bottom: none; }
  .eb-features li::before {
    content: '✓';
    color: var(--amber);
    font-weight: 700;
    flex-shrink: 0;
  }
  .eb-spots {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 20px;
  }
  .eb-spots-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .eb-spots-fill {
    height: 100%;
    width: 0%;
    background: var(--amber);
    border-radius: 2px;
  }
  .eb-spots-label { font-size: 12px; color: rgba(255,255,255,0.45); white-space: nowrap; }
  .eb-cta {
    display: block; width: 100%;
    background: var(--white);
    color: var(--ink);
    padding: 15px;
    border-radius: 100px;
    text-align: center;
    font-size: 15px; font-weight: 600;
    text-decoration: none;
    transition: opacity .2s;
  }
  .eb-cta:hover { opacity: .85; }

  /* 정규 플랜 (coming soon) */
  .regular-plans {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 520px;
    margin: 0 auto;
  }
  .plan-card-dim {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 22px;
    position: relative;
    opacity: 0.55;
  }
  .plan-dim-badge {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--border);
    color: var(--ink-muted);
    font-size: 10px; font-weight: 500;
    padding: 3px 12px; border-radius: 100px;
    white-space: nowrap;
  }
  .plan-dim-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 4px; }
  .plan-dim-price {
    font-family: 'Noto Serif KR', serif;
    font-size: 26px; font-weight: 600;
    color: var(--ink-muted);
    line-height: 1;
    margin-bottom: 2px;
  }
  .plan-dim-price span { font-size: 13px; font-weight: 400; }
  .plan-dim-sub { font-size: 11px; color: var(--ink-muted); }

  /* 가격 섹션 안내 */
  .pricing-note {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: var(--ink-muted);
  }


  /* 신청 모달 */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(28,28,26,0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 24px;
    padding: 40px 36px;
    width: 100%;
    max-width: 480px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none;
    font-size: 22px; color: var(--ink-muted);
    cursor: pointer; line-height: 1;
  }
  .modal-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px; font-weight: 600;
    margin-bottom: 6px;
  }
  .modal-sub { font-size: 13px; color: var(--ink-muted); margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .form-input, .form-select {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px; font-family: inherit;
    color: var(--ink); background: var(--white);
    box-sizing: border-box;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--ink); }
  .form-check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 24px; }
  .form-check input { margin-top: 2px; flex-shrink: 0; }
  .form-check label { font-size: 12px; color: var(--ink-muted); line-height: 1.5; }
  .modal-submit {
    width: 100%; padding: 15px;
    background: var(--ink); color: var(--white);
    border: none; border-radius: 100px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: opacity .2s;
  }
  .modal-submit:hover { opacity: .85; }
  .modal-form.hidden { display: none; }
  .modal-done { display: none; text-align: center; }
  .modal-done.active { display: block; }
  .done-icon { font-size: 48px; margin-bottom: 16px; }
  .done-title { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: var(--ink-muted); margin-bottom: 24px; }
  .done-bank { background: var(--cream); border-radius: 14px; padding: 20px 24px; text-align: left; margin-bottom: 16px; }
  .done-bank p { font-size: 14px; line-height: 2.2; }
  .done-note { font-size: 12px; color: var(--ink-muted); line-height: 1.6; }

  /* CTA BANNER */
  .cta-banner {
    background: var(--ink);
    color: var(--white);
    text-align: center;
    padding: 80px max(24px, calc((100% - 1100px) / 2));
  }
  .cta-banner h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .cta-banner p {
    font-size: 16px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 36px;
    font-weight: 300;
  }
  .btn-light {
    background: var(--white);
    color: var(--ink);
    padding: 14px 32px;
    border-radius: 100px;
    font-size: 15px; font-weight: 500;
    text-decoration: none;
    display: inline-block;
    transition: opacity .2s;
  }
  .btn-light:hover { opacity: .85; }

  /* FOOTER */
  footer {
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 48px max(24px, calc((100% - 1100px) / 2));
  }
  .footer-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 32px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }
  .footer-brand {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px; font-weight: 600;
    color: var(--ink);
  }
  .footer-brand-sub {
    font-size: 12px; color: var(--ink-muted);
    margin-top: 4px;
  }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a {
    font-size: 13px;
    color: var(--ink-muted);
    text-decoration: none;
    transition: color .2s;
  }
  .footer-links a:hover { color: var(--ink); }
  .footer-biz {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.9;
  }
  .footer-biz strong { color: var(--ink-light); font-weight: 500; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .hero { grid-template-columns: 1fr; gap: 48px; padding-top: 100px; }
    .hero-visual { display: none; }
    .stats-bar { flex-wrap: wrap; }
    .stat { min-width: 50%; border-right: none; border-bottom: 1px solid var(--border); }
    .stat:last-child { border-bottom: none; }
    .steps { grid-template-columns: 1fr; }
    .step:first-child { border-radius: 16px 16px 0 0; }
    .step:last-child { border-radius: 0 0 16px 16px; }
    .content-grid { grid-template-columns: 1fr; }
    .regular-plans { grid-template-columns: 1fr; }
    .earlybird-card { padding: 32px 24px; }
    .footer-top { flex-direction: column; gap: 20px; }
  }
</style>

    </div>

</div>

  const CLIENT_KEY = 'test_ck_EP59LybZ8BdWdpNwyN4nV6GYo7pR';

  // 모달 열기
  function openModal() {
    document.getElementById('applyForm').classList.remove('hidden');
    document.getElementById('applyDone').classList.remove('active');
    document.getElementById('applyModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  // 모달 닫기
  function closeModal() {
    document.getElementById('applyModal').classList.remove('active');
    document.body.style.overflow = '';
  }

  // 신청 제출 → 토스 카드 등록
  async function submitApply() {
    const name = document.getElementById('inputName').value.trim();
    const phone = document.getElementById('inputPhone').value.trim();
    const series = document.getElementById('inputSeries').value;
    const agree = document.getElementById('agreeCheck').checked;

    if (!name) { alert('이름을 입력해주세요.'); return; }
    if (!phone || !/^01[0-9]{8,9}$/.test(phone)) {
      alert('전화번호를 올바르게 입력해주세요.\n예: 01012345678 (하이픈 없이)'); return;
    }
    if (!series) { alert('시리즈를 선택해주세요.'); return; }
    if (!agree) { alert('환불 정책에 동의해주세요.'); return; }

    // 입력 정보 임시 저장
    sessionStorage.setItem('jm_name', name);
    sessionStorage.setItem('jm_phone', phone);
    sessionStorage.setItem('jm_series', series);
    const customerKey = 'jm_' + Date.now();
    sessionStorage.setItem('jm_customerKey', customerKey);

    try {
      const tossPayments = TossPayments(CLIENT_KEY);
      await tossPayments.requestBillingAuth('카드', {
        customerKey: customerKey,
        successUrl: window.location.origin + window.location.pathname + '?status=success',
        failUrl: window.location.origin + window.location.pathname + '?status=fail',
      });
    } catch (err) {
      if (err.code === 'USER_CANCEL') return;
      alert('오류가 발생했습니다.\n문의: justmoment.kr@gmail.com');
    }
  }

  // 오버레이 바깥 클릭 시 닫기
  window.addEventListener('DOMContentLoaded', function() {
    document.getElementById('applyModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // 토스 결제 완료 후 돌아왔을 때
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    if (status === 'success') {
      const series = sessionStorage.getItem('jm_series') || '';
      const seriesMap = {
        '부업시작': '부업 시작 30일',
        '갓생루틴': '갓생 루틴·생산성 30일',
        '직장인돈관리': '직장인 돈 관리 30일',
        '직장인세테크': '직장인 세테크 30일',
        '커리어성장': '직장인 커리어 성장 30일',
        '인간관계': '직장인 인간관계 30일',
      };
      document.getElementById('doneSeries').textContent = seriesMap[series] || series;
      document.getElementById('applyForm').classList.add('hidden');
      document.getElementById('applyDone').classList.add('active');
      document.getElementById('applyModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      window.history.replaceState({}, '', window.location.pathname);
    } else if (status === 'fail') {
      openModal();
      setTimeout(() => alert('결제가 취소되었습니다. 다시 시도해주세요.'), 300);
      window.history.replaceState({}, '', window.location.pathname);
    }
  });
</script>
</body>
